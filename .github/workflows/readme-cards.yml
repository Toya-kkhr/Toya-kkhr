name: Generate README cards

# 公開インスタンス（github-readme-stats.vercel.app）は 503 になるため、
# 後継の stats-organization 製 Action で SVG を自前生成してリポジトリに置く。

on:
  schedule:
    # 毎日 03:10 JST（18:10 UTC）に更新
    - cron: "10 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # GH_STATS_TOKEN（repo + read:user スコープの PAT）を Secrets に登録すると
      # private リポジトリの言語・コミットも集計対象になる。未登録なら public のみ。
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&hide_border=true&theme=transparent&icon_color=3FCF8E&title_color=3FCF8E&locale=ja
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&theme=transparent&title_color=3FCF8E&locale=ja
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet && exit 0
          git commit -m "chore: update README cards"
          git push
